name: Submit to the gallery
description: Share a layout, theme, effect or tile you made with everyone who uses Countertop.
title: "Submit: "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        In Countertop, open what you want to share and press **Submit to the gallery** on its Share screen, which fills in the code below:
        - a layout: Library → Share a layout
        - a theme: Library → Themes → open your theme → Share
        - an effect you made: Library → Effects → open your effect → Share
        - a tile: Library → New tile (Tile Studio) → your tile → Submit to the gallery. You can also paste the text of its `.countertop` file (`"countertop": "tile"`; see the [README](https://github.com/kizit/countertop-gallery#tiles) for what it needs). The form holds about 60 KB, so a larger tile goes in as a pull request instead

        Paste the code below. It's checked right away, and a pull request opens for review (a tile's code is read through line by line first). Once it's merged, it shows up in Library → Community.
  - type: textarea
    id: code
    attributes:
      label: Share code
      description: Starts with CT1. You can also paste the text of a .countertop file, which is how a tile goes in.
      render: text
    validations:
      required: true
  - type: textarea
    id: desc
    attributes:
      label: What it's for
      description: Optional. One or two sentences shown in Community. Leave empty to use the description from the code.
    validations:
      required: false
  - type: checkboxes
    id: ok
    attributes:
      label: Permission
      options:
        - label: I made this (or may share it), it has nothing private in it, and it can be shared under the MIT license.
          required: true
