name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Every item is valid
        run: python3 scripts/gallery.py check
      - name: Tests
        run: python3 -m unittest discover -s tests -v
